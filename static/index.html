<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video XP</title>
<style>
  :root { --bg:#000; --good:#3fb950; --bad:#f85149; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; }
  /* the player is 120px taller than the window, so YouTube's own title bar / "More videos" strip (drawn at the
     very top and bottom of the embed) sit off-screen; the video itself stays centered and uncropped */
  #player, #player iframe { position:fixed; left:0; top:-60px; width:100vw; height:calc(100dvh + 120px); border:0; }
  /* transparent layer over the video: catches mouse, taps and swipes so the page keeps control */
  #layer { position:fixed; inset:0; z-index:2; cursor:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
  #layer.awake { cursor:default; }
  .rate { position:fixed; right:28px; top:50%; transform:translateY(-50%); z-index:3; display:flex; flex-direction:column; gap:16px;
          opacity:0; transition:opacity .25s; pointer-events:none; }
  .rate.show { opacity:1; pointer-events:auto; }
  .rate button { width:64px; height:64px; border-radius:50%; border:0; background:rgba(20,20,20,.65); font-size:28px; cursor:pointer;
                 backdrop-filter:blur(6px); transition:transform .1s, background .15s; }
  .rate button:hover { transform:scale(1.08); }
  .rate button.on.like { background:var(--good); }
  .rate button.on.dislike { background:var(--bad); }
  .rate button.txt { font:700 15px system-ui, sans-serif; color:#eee; }
  .rate button.txt.on { background:#eee; color:#111; }
  #toast { position:fixed; left:50%; bottom:48px; transform:translateX(-50%); z-index:4; padding:8px 16px; border-radius:999px;
           background:rgba(20,20,20,.75); color:#eee; font:600 15px system-ui, sans-serif; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (pointer: coarse) {                                  /* phones / tablets */
    .rate { right:14px; gap:12px; }
    .rate button { width:54px; height:54px; font-size:24px; }
    .rate button.txt { font-size:14px; }
    #toast { bottom:28px; }
  }
  #wait { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#555; font:14px system-ui, sans-serif; z-index:1; }
</style>
</head>
<body>
<div id="player"></div>
<div id="wait"></div>
<div id="layer"></div>
<div class="rate" id="rate">
  <button class="like" id="like" title="Like (L)">👍</button>
  <button class="dislike" id="dislike" title="Dislike (D)">👎</button>
  <button class="txt" id="cc" title="Captions (C)">CC</button>
  <button class="txt" id="speed" title="Speed: ] faster, [ slower">1×</button>
</div>
<div id="toast"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
const $ = s => document.querySelector(s);
const api = (u, body) => fetch(u, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {}).then(r => r.json());
let S = { queue: [], played: [], cur: null, watched: 0, liked: null, filling: null, activated: false };
const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
const pref = { cc: localStorage.cc === "1", speed: parseFloat(localStorage.speed) || 1 };   // remembered across videos
let player = null, ytReady = false;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };

// ---------- queue ----------
function fill() {
  if (S.filling) return S.filling;
  const excl = [...S.queue, ...S.played.slice(-100), S.cur].filter(Boolean).map(v => v.id).join(",");
  // channel + category of the last few videos (incl. queued ones), so the server keeps the feed mixed
  const recent = [...S.played.slice(-2), S.cur, ...S.queue].filter(Boolean).slice(-3)
    .map(v => `${(v.channel || "").replace(/[|~]/g, " ")}~${v.topic || ""}`).join("|");
  S.filling = api(`/api/reel?n=2&exclude=${excl}&recent=${encodeURIComponent(recent)}`)
    .then(r => { for (const v of r.items) if (!S.queue.some(q => q.id === v.id)) S.queue.push(v); })
    .finally(() => { S.filling = null; });
  return S.filling;
}

// ---------- playback ----------
async function next() {
  flush();
  if (S.cur) S.played.push(S.cur);
  S.cur = null;
  if (!S.queue.length) await fill();
  while (!S.queue.length) {                                  // first start: pool still being built
    $("#wait").textContent = "getting videos ready…";
    await new Promise(r => setTimeout(r, 3000));
    await fill();
  }
  $("#wait").textContent = "";
  play(S.queue.shift());
  fill();
}

function back() {
  if (!S.played.length) return;
  flush();
  if (S.cur) S.queue.unshift(S.cur);
  play(S.played.pop());
}

function play(v) {
  S.cur = v; S.watched = 0; S.liked = null;
  $("#like").classList.remove("on"); $("#dislike").classList.remove("on");
  document.title = v.title || "Video XP";
  const go = () => {
    if (player && player.loadVideoById) { player.loadVideoById(v.id); return; }
    player = new YT.Player("player", { videoId: v.id, host: "https://www.youtube-nocookie.com",
      playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, fs: 0,
                    cc_load_policy: pref.cc ? 1 : 0, cc_lang_pref: "en" },
      events: {
        onReady: () => { if (S.activated) player.unMute(); },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED) next();
          if (e.data === YT.PlayerState.PLAYING && S.applied !== S.cur?.id) { S.applied = S.cur?.id; applyPrefs(); }
        },
        onError: () => { api("/api/unplayable", {id: S.cur && S.cur.id}); S.cur = null; next(); } } });
  };
  if (ytReady) go(); else { const t = setInterval(() => { if (ytReady) { clearInterval(t); go(); } }, 150); }
}

// seconds of the video actually watched (playing, not paused). At 1.5x, one second covers 1.5 s of video,
// so the model's "how much of it did you watch" stays correct at any speed.
setInterval(() => { if (player && player.getPlayerState && player.getPlayerState() === 1) S.watched += (player.getPlaybackRate() || 1); }, 1000);

// ---------- captions + speed ----------
function applyPrefs() {                  // YouTube resets both for every new video, so re-apply each time
  if (!player || !player.setPlaybackRate) return;
  player.setPlaybackRate(pref.speed);
  setCaptions(pref.cc);
  renderPrefs();
}
function setCaptions(on) {
  try {
    if (on) { player.loadModule("captions"); player.setOption("captions", "track", {languageCode: "en"}); }
    else { player.setOption("captions", "track", {}); player.unloadModule("captions"); }
  } catch (e) {}
}
function toggleCaptions() {
  pref.cc = !pref.cc; localStorage.cc = pref.cc ? "1" : "0";
  setCaptions(pref.cc); renderPrefs(); toast(pref.cc ? "Captions on" : "Captions off");
}
function changeSpeed(dir) {
  const i = SPEEDS.indexOf(pref.speed);
  const j = dir === 0 ? (i + 1) % SPEEDS.length : Math.min(SPEEDS.length - 1, Math.max(0, (i < 0 ? 1 : i) + dir));
  pref.speed = SPEEDS[j]; localStorage.speed = pref.speed;
  if (player && player.setPlaybackRate) player.setPlaybackRate(pref.speed);
  renderPrefs(); toast(pref.speed + "×");
}
function renderPrefs() {
  $("#cc").classList.toggle("on", pref.cc);
  $("#speed").textContent = pref.speed + "×";
  $("#speed").classList.toggle("on", pref.speed !== 1);
}
let toastT;
function toast(msg) {
  $("#toast").textContent = msg; $("#toast").classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("show"), 1100);
}

function flush() {
  const v = S.cur;
  if (!v || (S.watched < 1 && S.liked == null)) return;
  const dur = (player && player.getDuration && player.getDuration()) || v.duration || 0;
  navigator.sendBeacon("/api/event", new Blob([JSON.stringify({id: v.id, watched: S.watched, duration: dur, liked: S.liked})], {type: "application/json"}));
  S.watched = 0; S.liked = null;
}
window.addEventListener("beforeunload", flush);

function rate(x) {
  S.liked = x;
  $("#like").classList.toggle("on", x === 1); $("#dislike").classList.toggle("on", x === -1);
  if (x === -1) next(); else flush();
}

// first key press / click: sound on + fullscreen (browsers only allow both after you interact)
function activate() {
  if (S.activated) return;
  S.activated = true;
  if (player && player.unMute) player.unMute();
  const el = document.documentElement;
  const fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs && !document.fullscreenElement) {
    Promise.resolve(fs.call(el)).then(() => {                 // phones: turn sideways so the video fills the screen
      if (matchMedia("(pointer: coarse)").matches && screen.orientation && screen.orientation.lock)
        screen.orientation.lock("landscape").catch(() => {});
    }).catch(() => {});
  }
}

// ---------- input ----------
document.addEventListener("keydown", e => {
  activate();
  const k = e.key;
  if (k === "ArrowRight") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "Backspace") { e.preventDefault(); back(); }
  else if (k === " ") { e.preventDefault(); togglePause(); }
  else if (k === "l" || k === "L") rate(1);
  else if (k === "d" || k === "D") rate(-1);
  else if (k === "c" || k === "C") toggleCaptions();
  else if (k === "]" || k === ">") changeSpeed(1);
  else if (k === "[" || k === "<") changeSpeed(-1);
});
function togglePause() {
  if (!player || !player.getPlayerState) return;
  player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
}
$("#layer").addEventListener("click", () => {
  const first = !S.activated; activate();
  if (!first) togglePause();
  if (matchMedia("(pointer: coarse)").matches) showControls(3500);      // phones have no hover: a tap shows them
});

// phone: swipe up = next, swipe down = back (like Reels / Shorts)
let touch = null;
$("#layer").addEventListener("touchstart", e => { const t = e.touches[0]; touch = {x: t.clientX, y: t.clientY, at: Date.now()}; }, {passive: true});
$("#layer").addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dy = touch.y - t.clientY, dx = touch.x - t.clientX;
  const swipe = Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) && Date.now() - touch.at < 800;
  touch = null;
  if (!swipe) return;                                  // a plain tap falls through to the click handler
  e.preventDefault();
  activate();
  dy > 0 ? next() : back();
});
$("#like").onclick = () => rate(1);
$("#dislike").onclick = () => rate(-1);
$("#cc").onclick = toggleCaptions;
$("#speed").onclick = () => changeSpeed(0);       // click cycles 0.75 → 1 → 1.25 → … → 2 → 0.75
renderPrefs();

let idle;
function showControls(ms = 2000) {
  $("#rate").classList.add("show"); $("#layer").classList.add("awake");
  clearTimeout(idle);
  idle = setTimeout(() => { $("#rate").classList.remove("show"); $("#layer").classList.remove("awake"); }, ms);
}
document.addEventListener("mousemove", e => { if (!e.sourceCapabilities || !e.sourceCapabilities.firesTouchEvents) showControls(); });
document.addEventListener("touchstart", e => { if (e.target.closest(".rate")) showControls(3500); }, {passive: true});

next();
</script>
</body>
</html>
