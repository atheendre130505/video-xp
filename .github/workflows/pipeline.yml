name: video-xp

on:
  schedule:
    - cron: "17 */6 * * *"          # every 6 hours: crawl + retrain + publish
  workflow_dispatch: {}
  repository_dispatch:              # your phone uploaded watch data -> quick retrain
    types: [watch-data]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: code }
      - name: Set up yet? (cloud_setup.py creates the data branch)
        id: ready
        run: |
          if git -C code ls-remote --exit-code --heads origin data >/dev/null; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::No data branch yet. Run cloud_setup.py once."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
        with: { ref: data, path: data, fetch-depth: 1 }
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements-cloud.txt }
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-all-MiniLM-L6-v2 }
      - if: steps.ready.outputs.ok == 'true'
        name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r code/requirements-cloud.txt
      - if: steps.ready.outputs.ok == 'true'
        name: Remember which phone uploads this run sees
        run: ls data/events 2>/dev/null > seen-events.txt || true
      - if: steps.ready.outputs.ok == 'true'
        name: Pipeline (events -> crawl -> train -> feed)
        env:
          VXP_PASSPHRASE: ${{ secrets.VXP_PASSPHRASE }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python code/pipeline.py --data data --site site ${{ github.event_name == 'repository_dispatch' && '--quick' || '' }}
      - if: steps.ready.outputs.ok == 'true'
        name: Save encrypted database (data branch keeps one commit, so it doesn't grow)
        run: |
          cd data
          git config user.name "video-xp bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin data
          # keep phone uploads that arrived while this run was busy (the next run will read them)
          for f in $(git ls-tree --name-only origin/data events/ 2>/dev/null); do
            grep -qx "$(basename "$f")" ../seen-events.txt || git checkout origin/data -- "$f"
          done
          git checkout -q --orphan snapshot
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)"
          git push -q -f origin snapshot:data
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - if: steps.ready.outputs.ok == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
