<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Video XP</title>
<style>
  :root { --bg:#000; --good:#3fb950; --bad:#f85149; --panel:rgba(18,18,20,.94); --line:#2b2f35; --dim:#9aa1a9; --acc:#ff6a3d; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; overscroll-behavior:none; color:#eee;
               font:15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  /* player is 120px taller than the screen so YouTube's own title bar / end-screen strip sit off-screen */
  #player, #player iframe { position:fixed; left:0; top:-60px; width:100vw; height:calc(100dvh + 120px); border:0; }
  #layer { position:fixed; inset:0; z-index:2; cursor:none; touch-action:none; -webkit-tap-highlight-color:transparent; }
  #layer.awake { cursor:default; }
  .ctl { position:fixed; z-index:3; opacity:0; transition:opacity .25s; pointer-events:none; }
  .ctl.show { opacity:1; pointer-events:auto; }
  #rail { right:22px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px; }
  #rail button { border:0; background:rgba(20,20,20,.7); color:#eee; cursor:pointer; backdrop-filter:blur(6px);
                 transition:transform .1s, background .15s; }
  #rail button { width:60px; height:60px; border-radius:50%; font-size:26px; }
  #rail button:hover { transform:scale(1.06); }
  #rail button.txt { font:700 15px system-ui, sans-serif; }
  #rail button.on { background:#eee; color:#111; }
  #rail button.on.good { background:var(--good); } #rail button.on.bad { background:var(--bad); }
  /* "good or not good?" — asked on the side buttons themselves, never over the middle of the video */
  #rail.asking .good { background:var(--good); animation:pulse 1.4s infinite; }
  #rail.asking .bad { background:var(--bad); animation:pulse 1.4s infinite .7s; }
  @keyframes pulse { 50% { transform:scale(1.12); } }
  #asklabel { position:fixed; right:96px; top:50%; transform:translateY(-50%); z-index:3; display:none; padding:8px 12px; border-radius:12px;
              background:rgba(10,10,12,.8); font-weight:600; font-size:14px; pointer-events:none; text-align:right; }
  #rail.asking ~ #asklabel { display:block; }
  body.phone #rail.asking ~ #asklabel { display:none; }   /* phones: the pulsing buttons alone */
  body.ad #player, body.ad #player iframe { top:0; height:100dvh; }
  body.ad #layer { pointer-events:none; }
  #adpill { position:fixed; left:16px; top:16px; z-index:7; display:none; padding:8px 14px; border-radius:999px; font-weight:700;
            background:#ffd400; color:#111; pointer-events:none; }
  body.ad #adpill { display:block; }
  #toast { position:fixed; left:50%; bottom:40px; transform:translateX(-50%); z-index:6; padding:8px 16px; border-radius:999px;
           background:rgba(20,20,20,.8); font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
  #toast.show { opacity:1; }
  #wait { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#555; z-index:1; text-align:center; padding:20px; }
  .sheet { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.72); display:none; justify-content:center; align-items:flex-start;
           padding:max(6vh, env(safe-area-inset-top)) 14px 14px; backdrop-filter:blur(4px); }
  .sheet.open { display:flex; }
  .box { width:min(560px, 100%); max-height:88dvh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .box input { width:100%; box-sizing:border-box; font:inherit; color:#eee; background:#0c0d0f; border:1px solid var(--line);
               border-radius:10px; padding:11px 12px; outline:none; }
  .hint { color:var(--dim); font-size:13px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn { font:inherit; font-weight:600; border:0; border-radius:10px; padding:10px 16px; cursor:pointer; background:#2a2d33; color:#eee; }
  .btn.pri { background:var(--acc); color:#111; }
  label { display:block; font-size:13px; color:var(--dim); margin:12px 0 4px; }
  #rail .zoom { display:none; font-size:22px; }
  #player { transition:transform .2s; transform-origin:50% 50%; }
  body.phone #rail .zoom { display:block; }
  body.phone #rail { right:12px; gap:11px; } body.phone #rail button { width:54px; height:54px; font-size:23px; }
</style>
</head>
<body>
<div id="player"></div>
<div id="wait">loading…</div>
<div id="layer"></div>
<div class="ctl" id="rail">
  <button class="good" id="good" title="Good recommendation (G)">👍</button>
  <button class="bad" id="bad" title="Not good (B)">👎</button>
  <button class="txt" id="cc" title="Captions (C)">CC</button>
  <button class="txt" id="speed" title="Speed: ] faster, [ slower">1×</button>
  <button class="txt zoom" id="zin" title="Zoom in">＋</button>
  <button class="txt zoom" id="zout" title="Zoom out">－</button>
</div>
<div id="asklabel">Good recommendation?<br>tap 👍 or 👎</div>
<div id="adpill">Ad · use YouTube’s “Skip” button in the video</div>
<div id="toast"></div>


<script src="https://www.youtube.com/iframe_api"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const now = () => Date.now() / 1000;
// phone vs laptop by what the browser says it is (touch-screen laptops have touch too, so touch is not a test)
const IS_PHONE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
document.body.classList.toggle("phone", IS_PHONE);

// ---------------- data ----------------
const D = { rows: [], vec: null, dim: 128, byId: new Map(), generated: 0 };
const seen = new Set(LS.get("seen", []));              // reacted to (never shown again) — on this device or synced
let ratings = LS.get("ratings", {});                   // id -> {w, ts}: reactions made on this device
let progress = LS.get("progress", {});                 // id -> {pos, ts, t, c, d}: unfinished videos (resume point)
let cloud = LS.get("cloud", { generated: 0, taste: null });
const RELAY = "https://ntfy.sh/vxp-6a706fa3aaeeab939c2b3a5e";       // shared, keyless relay: watched / good / not good, by video id
const DEV = LS.get("dev", null) || (() => { const d = Math.random().toString(36).slice(2, 10); LS.set("dev", d); return d; })();
let lastLocal = LS.get("lastLocal", 0);                // last time you did something on this device
let stats = LS.get("stats", { n: 0, topics: {}, channels: {} });
let S = { queue: [], played: [], cur: null, watched: 0, secs: 0, fast: 0, skips: 0, activated: false, applied: null, ended: false };
// rushed = you hurried through it: mostly at ~2x, or kept jumping ahead. A weaker "good"; a soft dislike if you never react.
const rushed = () => S.skips >= 3 || (S.secs >= 20 && S.fast / S.secs > 0.5);

async function load() {
  const feed = await fetch("feed.json", { cache: "no-cache" }).then(r => r.json());
  const c = Object.fromEntries(feed.cols.map((k, i) => [k, i]));
  D.dim = feed.dim; D.generated = feed.generated;
  D.vec = Int8Array.from(atob(feed.vec), ch => ch.charCodeAt(0));
  D.rows = feed.rows.map((r, i) => ({ i, id: r[c.id], title: r[c.title], channel: r[c.channel], dur: r[c.duration],
                                      topic: r[c.topic], p: r[c.p], views: r[c.views], kind: r[c.kind] }));
  D.byId = new Map(D.rows.map(r => [r.id, r]));
}

// ---------------- taste vector ----------------
// cloud taste (from all synced reactions) + reactions made here since then: good pulls toward the video,
// not good pushes away, a fast skip pushes away a little
function taste() {
  const v = new Float32Array(D.dim);
  if (cloud.taste && cloud.taste.length === D.dim && cloud.generated === D.generated) for (let k = 0; k < D.dim; k++) v[k] = cloud.taste[k] * 3;
  for (const [id, r] of Object.entries(ratings)) {
    const row = D.byId.get(id);
    if (!row || (cloud.generated === D.generated && r.ts < cloud.generated && r.synced)) continue;
    const o = row.i * D.dim; for (let k = 0; k < D.dim; k++) v[k] += r.w * D.vec[o + k] / 127;
  }
  let m = 0; for (let k = 0; k < D.dim; k++) m += v[k] * v[k]; m = Math.sqrt(m);
  if (!m) return null; for (let k = 0; k < D.dim; k++) v[k] /= m; return v;
}
function cos(i, v) { let s = 0; const o = i * D.dim; for (let k = 0; k < D.dim; k++) s += D.vec[o + k] * v[k]; return s / 127; }

// ---------------- what plays next ----------------
// every 5 videos: taste, taste, ESSENTIAL (must-watch, least-seen topic), taste, EXPLORE (a channel you've never seen)
const PATTERN = ["t", "t", "m", "t", "x"];
function pickNext() {
  const busy = new Set([S.cur, ...S.queue].filter(Boolean).map(v => v.id));
  const free = D.rows.filter(r => !seen.has(r.id) && !busy.has(r.id) && !progress[r.id]);
  if (!free.length) return null;
  const last = S.queue.length ? S.queue[S.queue.length - 1] : S.cur;
  const slot = PATTERN[(stats.n + S.queue.length) % PATTERN.length];
  const T = taste();
  const tScore = r => r.p + (T ? 0.35 * cos(r.i, T) : 0) - (last && r.channel === last.channel ? 1 : 0) - 0.04 * (stats.channels[r.channel] || 0);
  let pool = free.filter(r => r.kind === slot), v;
  if (slot === "m" && pool.length) {
    const least = Math.min(...pool.map(r => stats.topics[r.topic] || 0));
    pool = pool.filter(r => (stats.topics[r.topic] || 0) === least);
    v = pool.sort((a, b) => (b.views || 0) - (a.views || 0))[Math.floor(Math.random() * Math.min(3, pool.length))];
  } else if (slot === "x" && pool.length) {
    const fresh = pool.filter(r => !stats.channels[r.channel]);
    v = (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length || pool.length))];
  } else {
    pool = pool.length ? pool : free;
    v = pool.sort((a, b) => tScore(b) - tScore(a))[0];
  }
  return v;
}
function fill() { while (S.queue.length < 2) { const v = pickNext(); if (!v) break; S.queue.push(v); } }

// ---------------- playback ----------------
let player = null, ytReady = false;
window.onYouTubeIframeAPIReady = () => { ytReady = true; };

function advance() {
  saveProgress(true);
  if (S.cur) S.played.push(S.cur);
  S.cur = null; fill();
  const v = S.queue.shift();
  if (!v) { $("#wait").textContent = "That’s everything for now. New videos arrive with the next cloud run."; return; }
  $("#wait").textContent = ""; play(v); fill();
}
// ↓ / swipe up: you must react first, always.
function next() {
  if (!S.cur) return advance();
  if (ratings[S.cur.id] || seen.has(S.cur.id)) return advance();      // went back to something already rated
  ask();
}
// jump within the video (→ ← keys, double-tap / double-click a side: 5 s). Jumping ahead repeatedly counts as rushing.
function seek(d) {
  if (!player || !player.seekTo || !S.cur) return;
  player.seekTo(Math.max(0, (player.getCurrentTime() || 0) + d), true);
  if (d > 0) S.skips += 1;
  toast((d > 0 ? "+" : "") + d + "s");
}
function back() { if (!S.played.length) return; saveProgress(true); if (S.cur) S.queue.unshift(S.cur); play(S.played.pop()); }

function play(v, at = 0, paused = false) {
  S.cur = v; S.watched = 0; S.secs = 0; S.fast = 0; S.skips = 0; S.ended = false; hideAsk(); loadSegments(v.id); document.body.classList.remove("ad");
  const r = ratings[v.id];
  $("#good").classList.toggle("on", !!r && r.w > 0); $("#bad").classList.toggle("on", !!r && r.w < 0);
  document.title = v.title || "Video XP";
  const go = () => {
    if (player && player.loadVideoById) { player[paused ? "cueVideoById" : "loadVideoById"]({ videoId: v.id, startSeconds: at }); return; }
    player = new YT.Player("player", { videoId: v.id, host: "https://www.youtube-nocookie.com",
      playerVars: { autoplay: paused ? 0 : 1, mute: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, playsinline: 1, fs: 0,
                    start: Math.floor(at), cc_load_policy: pref.cc ? 1 : 0, cc_lang_pref: "en" },
      events: {
        onReady: () => { if (S.activated) player.unMute(); if (pref.zoom > 1) setZoom(pref.zoom); },
        onStateChange: e => {
          if (e.data === YT.PlayerState.ENDED) { S.ended = true; if (S.cur && !ratings[S.cur.id]) ask(); }   // never auto-advances
          if (e.data === YT.PlayerState.PLAYING && S.applied !== S.cur?.id) { S.applied = S.cur?.id; applyPrefs(); }
          if (e.data === YT.PlayerState.PAUSED) { saveProgress(); if (!following) announceSoon("paused"); }
          if (e.data === YT.PlayerState.PLAYING && !adPlaying()) { following = false; announceSoon("playing"); }
        },
        onError: () => { if (S.cur) { seen.add(S.cur.id); LS.set("seen", [...seen].slice(-8000)); } S.cur = null; advance(); } } });
  };
  if (ytReady) go(); else { const t = setInterval(() => { if (ytReady) { clearInterval(t); go(); } }, 150); }
}
// ---------------- ads ----------------
// 1) Sponsor reads inside a video: skipped automatically, using SponsorBlock's community timestamps.
//    Lookup is by the first 4 characters of a hash of the video id, so the service doesn't learn what you watch.
let segs = [], segFor = null;
async function loadSegments(id) {
  segs = []; segFor = id;
  try {
    const dig = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(id));
    const h = [...new Uint8Array(dig)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 4);
    const r = await fetch(`https://sponsor.ajay.app/api/skipSegments/${h}?categories=${encodeURIComponent('["sponsor","selfpromo"]')}`);
    if (!r.ok) return;                                  // 404 = nothing known for this video
    const hit = (await r.json()).find(x => x.videoID === id);
    if (hit && segFor === id) segs = hit.segments.filter(x => x.actionType === "skip").map(x => x.segment);
  } catch {}
}
function skipSponsor() {
  if (!segs.length) return;
  const t = player.getCurrentTime();
  for (const [a, b] of segs) if (t >= a && t < b - 1) { player.seekTo(b, true); toast(`Skipped sponsor (${Math.round(b - a)}s)`); return; }
}
// 2) YouTube's own ads play inside its player, which a page can't control. We can tell one is playing
//    (the player reports a different video, or a length that isn't this video's) and then get out of the way,
//    so your tap reaches YouTube's Skip button.
function adPlaying() {
  if (!S.cur || !player || !player.getPlayerState) return false;
  try {
    const d = player.getVideoData && player.getVideoData();
    if (d && d.video_id && d.video_id !== S.cur.id) return true;
    const len = player.getDuration(), want = S.cur.dur;
    return player.getPlayerState() === 1 && want > 0 && len > 0 && Math.abs(len - want) > Math.max(10, 0.1 * want);
  } catch { return false; }
}

setInterval(() => {
  const ad = adPlaying();
  document.body.classList.toggle("ad", ad);
  if (ad) return;                                       // ad time is not watch time
  if (player && player.getPlayerState && player.getPlayerState() === 1) { skipSponsor(); const rate = player.getPlaybackRate() || 1; S.secs += 1; S.watched += rate; if (rate >= 1.75) S.fast += 1;
    if (S.secs % 15 === 0) saveProgress();
    if (S.secs % 180 === 0) announce("playing"); }
}, 1000);

// ---------------- reactions + progress: stored here, synced to the cloud ----------------
function pos() { try { return Math.floor(player.getCurrentTime()) || 0; } catch { return 0; } }
function dur() { try { return Math.round(player.getDuration()) || S.cur?.dur || 0; } catch { return S.cur?.dur || 0; } }
function queueEvent(e) {                                // one pending entry per video; a reaction replaces progress
  const q = LS.get("outbox", []).filter(x => x.id !== e.id || (x.liked != null && e.liked == null));
  if (!q.some(x => x.id === e.id)) q.push(e);
  LS.set("outbox", q);
}
function react(x) {
  const v = S.cur; if (!v) return;
  const soft = x > 0 && rushed();                       // a rushed "good" counts less
  const w = x > 0 ? (soft ? 0.4 : 1) : -0.7;
  ratings[v.id] = { w, ts: now() }; LS.set("ratings", ratings);
  seen.add(v.id); LS.set("seen", [...seen].slice(-8000));
  delete progress[v.id]; LS.set("progress", progress);
  stats.n += 1; stats.topics[v.topic] = (stats.topics[v.topic] || 0) + 1; stats.channels[v.channel] = (stats.channels[v.channel] || 0) + 1; LS.set("stats", stats);
  queueEvent({ id: v.id, liked: x > 0 ? 1 : -1, soft: soft ? 1 : 0, watched: Math.round(S.watched), pos: pos(), duration: dur(), ts: now() });
  touch_();
  S.queue = [];                                         // re-pick with the updated taste
  advance(); syncSoon();
}
function saveProgress(final = false) {
  const v = S.cur;
  if (!v || ratings[v.id] || seen.has(v.id) || S.secs < 3) return;
  const p = pos(); if (!p) return;
  touch_();
  const soft = rushed() ? 1 : 0;                        // rushed and never reacted = soft dislike (not resumed later)
  progress[v.id] = { pos: p, ts: now(), t: v.title, c: v.channel, d: v.dur || dur(), soft }; LS.set("progress", progress);
  queueEvent({ id: v.id, liked: null, soft, watched: Math.round(S.watched), pos: p, duration: dur(), ts: now(),
               t: v.title, c: v.channel, g: v.topic });
  if (final) syncSoon();
}
// leaving (another tab, another app, screen off): pause, remember the position, sync it right away so another
// device can pick up from here. Coming back: carry on, but only if it was us who paused it.
let autoPaused = false;
function away() {
  if (player && player.getPlayerState && player.getPlayerState() === 1) { following = true; player.pauseVideo(); autoPaused = true; }
  saveProgress(); announce("paused", true);
}
function returned() {
  const resumeHere = autoPaused; autoPaused = false;
  pull().then(switched => { if (!switched && resumeHere && !following && player && player.playVideo) player.playVideo(); });
}
document.addEventListener("visibilitychange", () => { document.visibilityState === "hidden" ? away() : returned(); });
// switching to another window on a PC doesn't hide the tab, so also watch focus. Clicking inside the video itself
// (YouTube's Skip-ad button) moves focus into the player: that is not leaving.
window.addEventListener("blur", () => setTimeout(() => { if (!document.hasFocus() && document.activeElement?.tagName !== "IFRAME") away(); }, 0));
window.addEventListener("focus", returned);

function ask() { $("#rail").classList.add("asking"); showControls(600000); }
function hideAsk() { $("#rail").classList.remove("asking"); }

// ---------------- sync: one shared relay, no setup ----------------
// Every device posts what you did (by video id) to the relay and reads it back. The cloud reads it every hour,
// retrains, and publishes state.json (everything you rated + your taste). Nothing else is sent: no name, no account.
function touch_() { lastLocal = now(); LS.set("lastLocal", lastLocal); }
let syncing = false, syncT;
function syncSoon() { clearTimeout(syncT); syncT = setTimeout(sync, 1500); }
async function sync(leaving = false) {
  const q = LS.get("outbox", []);
  if (syncing || !q.length) return;
  syncing = true;
  try {
    for (let i = 0; i < q.length; i += 15) {          // relay messages are capped at 4 KB
      const r = await fetch(RELAY, { method: "POST", keepalive: leaving, body: JSON.stringify({ dev: DEV, events: q.slice(i, i + 15) }) });
      if (!r.ok) throw new Error(`relay ${r.status}`);
    }
    const sent = new Set(q.map(e => e.id + ":" + e.ts));
    LS.set("outbox", LS.get("outbox", []).filter(e => !sent.has(e.id + ":" + e.ts)));
    LS.set("lastSync", Date.now());
  } catch (e) { console.warn("sync failed, will retry", e); }
  finally { syncing = false; }
}
setInterval(() => { if (LS.get("outbox", []).length) sync(); }, 60000);

function applyEvent(e, remote) {
  if (e.liked != null) {
    seen.add(e.id); delete progress[e.id];
    if (!ratings[e.id]) ratings[e.id] = { w: e.liked > 0 ? (e.soft ? 0.4 : 1) : -0.7, ts: e.ts, synced: 1 };
  } else mergeProgress(e.id, { pos: e.pos, ts: e.ts, t: e.t, c: e.c, d: e.duration, g: e.g, soft: e.soft });
}
function saveAll() { LS.set("seen", [...seen].slice(-8000)); LS.set("ratings", ratings); LS.set("progress", progress); }

// ---------------- one video at a time, on all your devices ----------------
// Each device announces what it is doing ("playing" / "paused", which video, where) and listens live for the
// others. When another device starts playing, this one pauses and lines up the same video at the same spot.
// If both try to play at once, the laptop wins. On open / return, you continue from the most recent position
// on any device.
const KIND = IS_PHONE ? "phone" : "laptop";
let following = false;                                 // paused because another device is playing
let myNow = LS.get("myNow", null);
function nowInfo(state) {
  const v = S.cur;
  return v && { id: v.id, pos: pos(), state, ts: now(), t: v.title, c: v.channel, d: v.dur || dur(), g: v.topic };
}
async function announce(state, leaving = false) {
  const n = nowInfo(state); if (!n) return;
  myNow = n; LS.set("myNow", n);
  const q = LS.get("outbox", []).slice(0, 12);          // piggyback pending reactions (relay messages max 4 KB)
  try {
    const r = await fetch(RELAY, { method: "POST", keepalive: leaving, body: JSON.stringify({ dev: DEV, kind: KIND, now: n, events: q }) });
    if (r.ok && q.length) {
      const sent = new Set(q.map(e => e.id + ":" + e.ts));
      LS.set("outbox", LS.get("outbox", []).filter(e => !sent.has(e.id + ":" + e.ts)));
    }
  } catch (e) { console.warn("announce failed", e); }
}
let annT = null, annLast = { key: "", at: 0 };
function announceSoon(state) {                         // play/pause can flicker (buffering): settle, then send once
  clearTimeout(annT);
  annT = setTimeout(() => {
    const key = state + ":" + (S.cur && S.cur.id);
    if (key === annLast.key && Date.now() - annLast.at < 30000) return;
    annLast = { key, at: Date.now() }; announce(state);
  }, 1200);
}
const playingHere = () => !!(player && player.getPlayerState && player.getPlayerState() === 1);

function rowFor(n) {
  const p = progress[n.id] || {};
  return D.byId.get(n.id) || { id: n.id, title: n.t || p.t || "", channel: n.c || p.c || "", dur: n.d || p.d, topic: n.g || p.g || "", p: 0, kind: "t" };
}
// line up what another device is playing, paused here
function follow(n) {
  following = true; autoPaused = false;
  if (playingHere()) player.pauseVideo();
  if (S.cur && S.cur.id === n.id) { try { player.seekTo(n.pos, true); player.pauseVideo(); } catch {} }
  else { if (S.cur && !ratings[S.cur.id]) saveProgress(); if (S.cur) S.played.push(S.cur); S.queue = []; $("#wait").textContent = ""; play(rowFor(n), n.pos, true); fill(); }
  toast(`Playing on your ${n.kind}`);
}
// open a position here and play it (you're using this device now)
function openHere(n) {
  following = false;
  if (S.cur && S.cur.id === n.id) { if (Math.abs(pos() - n.pos) > 10) player.seekTo(n.pos, true); return; }
  if (S.cur && !ratings[S.cur.id]) saveProgress();
  if (S.cur) S.played.push(S.cur);
  S.queue = []; $("#wait").textContent = ""; play(rowFor(n), Math.max(0, n.pos - 2)); S.secs = 3; fill();
}

function onMessage(b) {
  if (!b || b.dev === DEV) return;
  for (const e of b.events || []) applyEvent(e, true);
  saveAll();
  const n = b.now && { ...b.now, kind: b.kind || "laptop", dev: b.dev };
  if (n && n.state === "playing" && !seen.has(n.id)) {
    if (playingHere() && KIND === "laptop" && n.kind === "phone") { annLast.key = ""; announce("playing"); return; }   // laptop wins
    follow(n);
  } else if (S.cur && seen.has(S.cur.id) && !playingHere()) { S.queue = []; advance(); }   // rated on the other device
}
function listen() {                                    // live link: messages arrive within a second or two
  try {
    const es = new EventSource(`${RELAY}/sse`);
    es.onmessage = ev => { try { const m = JSON.parse(ev.data); if (m.event === "message") onMessage(JSON.parse(m.message)); } catch {} };
  } catch (e) { console.warn("live link unavailable", e); }
}

// on open / return: catch up, then continue from the most recent position on any device (laptop if it's playing)
async function pull() {
  try {
    const st = await fetch("state.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null);
    if (st) {
      cloud = { generated: st.generated, taste: st.taste }; LS.set("cloud", cloud);
      for (const id of st.rated || []) seen.add(id);
      for (const pr of st.progress || []) mergeProgress(pr.id, pr);
    }
  } catch (e) { console.warn("state.json", e); }
  const latest = {};                                   // dev -> newest "now"
  try {
    const txt = await fetch(`${RELAY}/json?poll=1&since=12h`, { cache: "no-store" }).then(r => r.ok ? r.text() : "");
    for (const line of txt.split("\n")) {
      if (!line.trim()) continue;
      let m; try { m = JSON.parse(line); } catch { continue; }
      if (m.event !== "message") continue;
      let b; try { b = JSON.parse(m.message); } catch { continue; }
      for (const e of b.events || []) applyEvent(e, b.dev !== DEV);
      if (b.now && (!latest[b.dev] || b.now.ts > latest[b.dev].ts)) latest[b.dev] = { ...b.now, kind: b.kind || "laptop", dev: b.dev };
    }
  } catch (e) { console.warn("relay", e); }
  saveAll();
  if (myNow && (!latest[DEV] || myNow.ts > latest[DEV].ts)) latest[DEV] = { ...myNow, kind: KIND, dev: DEV };
  const all = Object.values(latest).filter(n => n.id && !seen.has(n.id));
  const live = all.filter(n => n.dev !== DEV && n.state === "playing" && now() - n.ts < 200);
  const liveLaptop = live.find(n => n.kind === "laptop");
  if (liveLaptop && KIND === "phone") { follow(liveLaptop); return true; }      // laptop is playing: phone waits
  const newest = all.sort((a, b) => b.ts - a.ts)[0];
  if (!newest) { if (S.cur && seen.has(S.cur.id)) { S.queue = []; advance(); return true; } return false; }
  openHere(newest); return true;
}
function mergeProgress(id, p) {
  if (seen.has(id) || ratings[id] || !p.pos) return;
  const row = D.byId.get(id), old = progress[id];
  if (!old || p.ts > old.ts) progress[id] = { pos: p.pos, ts: p.ts, t: p.t || old?.t || row?.title, c: p.c || old?.c || row?.channel,
                                             d: p.d || old?.d || row?.dur, g: p.g || old?.g || row?.topic, soft: p.soft ? 1 : 0 };
}

// ---------------- captions + speed ----------------
const SPEEDS = [0.75, 1, 1.25, 1.5, 1.75, 2];
const pref = LS.get("pref", { cc: false, speed: 1 });
function applyPrefs() { if (!player || !player.setPlaybackRate) return; player.setPlaybackRate(pref.speed); setCaptions(pref.cc); renderPrefs(); }
function setCaptions(on) { try { if (on) { player.loadModule("captions"); player.setOption("captions", "track", { languageCode: "en" }); } else { player.setOption("captions", "track", {}); player.unloadModule("captions"); } } catch {} }
function toggleCaptions() { pref.cc = !pref.cc; LS.set("pref", pref); setCaptions(pref.cc); renderPrefs(); toast(pref.cc ? "Captions on" : "Captions off"); }
function changeSpeed(dir) {
  const i = SPEEDS.indexOf(pref.speed);
  pref.speed = SPEEDS[dir === 0 ? (i + 1) % SPEEDS.length : Math.min(SPEEDS.length - 1, Math.max(0, (i < 0 ? 1 : i) + dir))];
  LS.set("pref", pref); if (player && player.setPlaybackRate) player.setPlaybackRate(pref.speed); renderPrefs(); toast(pref.speed + "×");
}
function setZoom(z) {
  pref.zoom = Math.min(3, Math.max(1, Math.round(z * 4) / 4)); LS.set("pref", pref);
  const el = document.getElementById("player"); if (el) el.style.transform = pref.zoom === 1 ? "" : `scale(${pref.zoom})`;
  toast(pref.zoom === 1 ? "Zoom: fit" : `Zoom ${pref.zoom}×`);
}
function renderPrefs() { $("#cc").classList.toggle("on", pref.cc); $("#speed").textContent = pref.speed + "×"; $("#speed").classList.toggle("on", pref.speed !== 1); }
let toastT; function toast(m) { $("#toast").textContent = m; $("#toast").classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("show"), 1400); }

const sheetOpen = () => false;

// ---------------- input ----------------
function activate() {
  if (S.activated) return; S.activated = true;
  if (player && player.unMute) player.unMute();
  const el = document.documentElement, fs = el.requestFullscreen || el.webkitRequestFullscreen;
  if (fs && !document.fullscreenElement) Promise.resolve(fs.call(el)).then(() => {
    if (IS_PHONE && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
  }).catch(() => {});
}
function toggleFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
}
function togglePause() { autoPaused = false; if (!player || !player.getPlayerState) return; player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
document.addEventListener("keydown", e => {
  activate();
  const k = e.key.toLowerCase();
  if (k === "arrowright") { e.preventDefault(); seek(5); }
  else if (k === "arrowleft") { e.preventDefault(); seek(-5); }
  else if (k === "arrowdown" || k === "n") { e.preventDefault(); next(); }
  else if (k === "arrowup" || k === "backspace") { e.preventDefault(); back(); }
  else if (k === " ") { e.preventDefault(); togglePause(); }
  else if (k === "g" || k === "l") react(1);
  else if (k === "b" || k === "d") react(-1);
  else if (k === "c") toggleCaptions();
  else if (k === "f") toggleFullscreen();
  else if (k === "]" || k === ">") changeSpeed(1);
  else if (k === "[" || k === "<") changeSpeed(-1);
});
// single tap / click = pause (after a short wait, in case it's a double); double on the right / left half = 5 s forward / back
let tapT = null;
$("#layer").addEventListener("click", e => {
  const first = !S.activated; activate();
  if (IS_PHONE) showControls(4000);
  if (first) return;
  if (tapT) { clearTimeout(tapT); tapT = null; seek(e.clientX > innerWidth / 2 ? 5 : -5); return; }
  tapT = setTimeout(() => { tapT = null; if (!S.ended) togglePause(); }, 260);
});
let touch = null;
$("#layer").addEventListener("touchstart", e => { const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY, at: Date.now() }; }, { passive: true });
$("#layer").addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dy = touch.y - t.clientY, dx = touch.x - t.clientX;
  const swipe = Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx) && Date.now() - touch.at < 800;
  touch = null; if (!swipe) return;
  e.preventDefault(); activate(); dy > 0 ? next() : back();
});
$("#good").onclick = () => react(1);
$("#bad").onclick = () => react(-1);
$("#cc").onclick = toggleCaptions; $("#speed").onclick = () => changeSpeed(0);
$("#zin").onclick = () => setZoom((pref.zoom || 1) + 0.25); $("#zout").onclick = () => setZoom((pref.zoom || 1) - 0.25);

let idle;
function showControls(ms = 2200) {
  $("#rail").classList.add("show"); $("#layer").classList.add("awake");
  clearTimeout(idle); idle = setTimeout(() => { if ($("#rail").classList.contains("asking")) return; $("#rail").classList.remove("show"); $("#layer").classList.remove("awake"); }, ms);
}
document.addEventListener("mousemove", e => { if (!e.sourceCapabilities || !e.sourceCapabilities.firesTouchEvents) showControls(); });
document.addEventListener("touchstart", e => { if (e.target.closest(".ctl")) showControls(4000); }, { passive: true });

// ---------------- start ----------------
if (location.hash) history.replaceState(null, "", location.pathname);    // old setup links: nothing to set up any more
renderPrefs();
if (!pref.zoom) pref.zoom = 1;
load().then(async () => {
  listen();
  const switched = await Promise.race([pull(), new Promise(r => setTimeout(() => r(false), 4000))]);
  if (switched) { sync(); return; }
  // pick up where you left off on this device (or the most recent unfinished video anywhere)
  const resume = Object.entries(progress).filter(([id, p]) => !seen.has(id) && !ratings[id] && !p.soft).sort((a, b) => b[1].ts - a[1].ts)[0];
  if (resume && resume[1].t) {
    const [id, p] = resume, row = D.byId.get(id) || { id, title: p.t, channel: p.c, dur: p.d, topic: p.g || "", p: 0, kind: "t" };
    $("#wait").textContent = ""; play(row, Math.max(0, p.pos - 3)); S.secs = 3; fill(); toast("Continuing where you left off");
  } else advance();
  sync();
}).catch(e => { $("#wait").textContent = "Couldn’t load the feed. Check your connection and reload."; console.error(e); });
</script>
</body>
